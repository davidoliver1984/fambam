name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Validate repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run foundation checks
        run: make foundation-check
