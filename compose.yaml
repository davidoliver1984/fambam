name: fambam

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3010}:5173"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8082}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - fambam

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8080
    ports:
      - "${API_PORT:-8082}:8080"
    environment:
      APP_NAME: "fambam"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${API_PORT:-8082}"
      WEB_URL: "http://localhost:${WEB_PORT:-3010}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-3010}"
      SANCTUM_STATEFUL_DOMAINS: "localhost:${WEB_PORT:-3010}"
      INVITATION_LIFETIME_DAYS: "${INVITATION_LIFETIME_DAYS:-7}"
      INVITATION_CLAIM_LIFETIME_MINUTES: "${INVITATION_CLAIM_LIFETIME_MINUTES:-15}"
      COMPROMISED_PASSWORD_CHECK_ENABLED: "${COMPROMISED_PASSWORD_CHECK_ENABLED:-true}"
      COMPROMISED_PASSWORD_CHECK_TIMEOUT: "${COMPROMISED_PASSWORD_CHECK_TIMEOUT:-1.5}"
      HASH_DRIVER: argon2id
      HASH_VERIFY: "false"
      LOG_CHANNEL: stderr
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: fambam-api
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROPAGATORS: tracecontext,baggage
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-fambam}"
      DB_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      DB_PASSWORD: "${DB_RUNTIME_PASSWORD:-fambam_app}"
      DB_RUNTIME_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      QUEUE_CONNECTION: sqs
      SQS_PREFIX: "http://localstack:4566/000000000000"
      SQS_QUEUE: fambam-jobs
      IMAGE_ANALYSIS_QUEUE: image-analysis-requested
      SQS_ENDPOINT: "http://localstack:4566"
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
      AWS_BUCKET: "${AWS_BUCKET:-fambam-media}"
      AWS_ENDPOINT: "http://localstack:4566"
      AWS_PUBLIC_ENDPOINT: "http://localhost:${LOCALSTACK_PORT:-4570}"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      MEDIA_UPLOAD_AUTHORITY_TTL_MINUTES: "${MEDIA_UPLOAD_AUTHORITY_TTL_MINUTES:-15}"
      MEDIA_UPLOAD_MAX_BYTES: "${MEDIA_UPLOAD_MAX_BYTES:-104857600}"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: archive@fambam.test
      MAIL_FROM_NAME: "fambam"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      localstack-provision:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - fambam

  queue-worker:
    image: fambam-api
    command: php artisan queue:work sqs --sleep=3 --tries=3 --timeout=120
    environment:
      APP_NAME: "fambam"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      LOG_CHANNEL: stderr
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: fambam-queue-worker
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROPAGATORS: tracecontext,baggage
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-fambam}"
      DB_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      DB_PASSWORD: "${DB_RUNTIME_PASSWORD:-fambam_app}"
      DB_RUNTIME_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sqs
      SQS_PREFIX: "http://localstack:4566/000000000000"
      SQS_QUEUE: fambam-jobs
      SQS_ENDPOINT: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fambam

  scheduler:
    image: fambam-api
    command: php artisan schedule:work
    environment:
      APP_NAME: "fambam"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      LOG_CHANNEL: stderr
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: fambam-scheduler
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROPAGATORS: tracecontext,baggage
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-fambam}"
      DB_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      DB_PASSWORD: "${DB_RUNTIME_PASSWORD:-fambam_app}"
      DB_RUNTIME_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: sqs
      SQS_PREFIX: "http://localstack:4566/000000000000"
      SQS_QUEUE: fambam-jobs
      SQS_ENDPOINT: "http://localstack:4566"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fambam

  api-migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: php artisan migrate --force
    environment:
      APP_NAME: "fambam"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${POSTGRES_DB:-fambam}"
      DB_USERNAME: "${POSTGRES_USER:-fambam}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-fambam}"
      DB_RUNTIME_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - fambam

  image-ai:
    build:
      context: ./apps/image-ai
      dockerfile: Dockerfile
    ports:
      - "${IMAGE_AI_PORT:-8010}:8000"
    environment:
      OTEL_SERVICE_NAME: fambam-image-ai
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_PROPAGATORS: tracecontext,baggage
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
      SQS_ENDPOINT: http://localstack:4566
      SQS_PREFIX: http://localstack:4566/000000000000
      SQS_QUEUE: image-analysis-requested
    depends_on:
      localstack-provision:
        condition: service_completed_successfully
      otel-collector:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - fambam

  postgres:
    image: postgres:17.6-alpine
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fambam}"
      POSTGRES_USER: "${POSTGRES_USER:-fambam}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-fambam}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - fambam

  postgres-provision:
    image: postgres:17.6-alpine
    command: ["/opt/fambam/provision-runtime-role.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-fambam}"
      PGUSER: "${POSTGRES_USER:-fambam}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-fambam}"
      DB_RUNTIME_USERNAME: "${DB_RUNTIME_USERNAME:-fambam_app}"
      DB_RUNTIME_PASSWORD: "${DB_RUNTIME_PASSWORD:-fambam_app}"
    volumes:
      - ./infrastructure/docker/postgres/provision-runtime-role.sh:/opt/fambam/provision-runtime-role.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - fambam

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - fambam

  localstack:
    image: localstack/localstack:4.5.0
    ports:
      - "${LOCALSTACK_PORT:-4570}:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
      AWS_BUCKET: "${AWS_BUCKET:-fambam-media}"
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infrastructure/docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - fambam

  localstack-provision:
    image: localstack/localstack:4.5.0
    entrypoint: ["/bin/sh"]
    command: ["/opt/fambam/10-bootstrap.sh"]
    environment:
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-west-2}"
      AWS_BUCKET: "${AWS_BUCKET:-fambam-media}"
      LOCALSTACK_ENDPOINT: http://localstack:4566
      CORS_ALLOWED_ORIGIN: "http://localhost:${WEB_PORT:-3010}"
    volumes:
      - ./infrastructure/docker/localstack/init/10-bootstrap.sh:/opt/fambam/10-bootstrap.sh:ro
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
    networks:
      - fambam

  mailpit:
    image: axllent/mailpit:v1.27.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - fambam

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4327}:4317"
      - "${OTEL_HTTP_PORT:-4328}:4318"
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - fambam

  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    ports:
      - "${GRAFANA_PORT:-3011}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fambam

volumes:
  localstack-data:
  postgres-data:
  redis-data:

networks:
  fambam:
    name: fambam
